# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring.application.name=project

# CHANGE HERE: Set the desired server port (Default is 8080)
server.port=8080

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# CHANGE HERE: Update 'project_db' to your actual database name if different
spring.datasource.url=jdbc:mysql://localhost:3306/project_db?useSSL=false&serverTimezone=UTC

# CHANGE HERE: Update with your MySQL username
spring.datasource.username=root

# CHANGE HERE: Update with your MySQL password
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
